name: Build & Test

on:
  push:
    branches: [main, no-vpnchain]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build daemon (arm64)
        working-directory: daemon
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/arm64-v8a/sshcustomd ./cmd/sshcustomd/
      
      - name: Build daemon (armv7)
        working-directory: daemon
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/armeabi-v7a/sshcustomd ./cmd/sshcustomd/
      
      - name: go vet
        working-directory: daemon
        run: go vet ./...
      
      - name: go test
        working-directory: daemon
        run: go test ./... -v -count=1
      
      - name: Verify binaries
        run: |
          file build/arm64-v8a/sshcustomd
          file build/armeabi-v7a/sshcustomd
      
      - uses: actions/upload-artifact@v4
        with:
          name: sshcustomd-binaries
          path: build/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sshcustomd-binaries
          path: build/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/arm64-v8a/sshcustomd,build/armeabi-v7a/sshcustomd
          prerelease: true
